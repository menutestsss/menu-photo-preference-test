<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Decoder</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#fff;color:#0d0d0d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px 16px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#4d4d4d;margin:0 0 14px;line-height:1.5}
  textarea{width:100%;height:140px;font:14px ui-monospace,Menlo,monospace;padding:10px;border:1px solid #d6d6d6;border-radius:10px;box-sizing:border-box}
  table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #eee}
  th{font-weight:600;color:#4d4d4d}
  .tal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
  .box{background:#f6f6f6;border-radius:12px;padding:14px}
  .box h3{margin:0 0 8px;font-size:15px}
  .bad{color:#b42318}
  .scroll{overflow-x:auto}
</style>
</head>
<body><div class="wrap">
  <h1>Decode completion codes</h1>
  <p>Paste participant codes, one per line (for example <code>2BAA-3ANB</code>). Each code says which menu showed the enhanced photos, so A/B picks become Enhanced, Original, or No difference.</p>
  <textarea id="in" placeholder="2BAA-3ANB"></textarea>
  <div class="tal" id="tal"></div>
  <div class="scroll"><table id="out"></table></div>
</div>
<script>
const STYLE = { '2': 'v2 (pro photoshoot)', '3': 'v3 (natural, in-restaurant)' };
const pickName = (ans, enhSide) => ans === 'N' ? 'No difference' : ('AB'.indexOf(ans) === enhSide ? 'Enhanced' : 'Original');
function parse(code){
  const rounds = code.trim().toUpperCase().split('-');
  if(rounds.length !== 2 || !rounds.every(x => /^[23][AB][ABN][ABN]$/.test(x))) return null;
  return rounds.map((x, i) => ({ round: i + 1, style: x[0], enhSide: 'AB'.indexOf(x[1]),
    appetizing: pickName(x[2], 'AB'.indexOf(x[1])), order: pickName(x[3], 'AB'.indexOf(x[1])) }));
}
function render(){
  const lines = document.getElementById('in').value.split(/\s+/).filter(Boolean);
  const t = { '2': {}, '3': {} };
  let rows = '<tr><th>#</th><th>Code</th><th>Round</th><th>Style</th><th>More appetizing</th><th>More likely to order</th></tr>';
  lines.forEach((c, n) => {
    const d = parse(c);
    if(!d){ rows += `<tr><td>${n+1}</td><td class="bad">${c.replace(/</g,'&lt;')}</td><td colspan="4" class="bad">invalid code</td></tr>`; return; }
    d.forEach(x => {
      rows += `<tr><td>${n+1}</td><td>${c}</td><td>${x.round}</td><td>${STYLE[x.style]}</td><td>${x.appetizing}</td><td>${x.order}</td></tr>`;
      const s = t[x.style];
      ['appetizing','order'].forEach(q => { s[q] = s[q] || {}; s[q][x[q]] = (s[q][x[q]] || 0) + 1; });
    });
  });
  document.getElementById('out').innerHTML = lines.length ? rows : '';
  document.getElementById('tal').innerHTML = Object.entries(t).filter(([, s]) => s.appetizing).map(([k, s]) => {
    const line = (q, lbl) => { const o = s[q], n = Object.values(o).reduce((a, b) => a + b, 0);
      return `<div><b>${lbl}</b> (n=${n})<br>` + ['Enhanced','Original','No difference'].map(x => `${x}: ${o[x] || 0} (${Math.round(100 * (o[x] || 0) / n)}%)`).join('<br>') + '</div>'; };
    return `<div class="box"><h3>${STYLE[k]}</h3>${line('appetizing','More appetizing')}<br>${line('order','More likely to order')}</div>`;
  }).join('');
}
document.getElementById('in').addEventListener('input', render);
</script>
</body>
</html>
